name: Git-Hub-Actions-Summary

on:
  push:
    branches:
      - main
      - update/s3-bucket-task
    paths:
      - '.github/workflows/github-actions-summary.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: 'us-east-1'
  S3_BUCKET_NAME: 'github-actions-tf-task-zhyldyz'
  TF_VERSION: '~> 1.11.4'

permissions:
  id-token: write
  contents: read

jobs:
  tf_plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    env:
      TF_PLAN_OUTPUT_FILE: 'terraform_plan_output.txt'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init
        working-directory: infra

      - name: Terraform Validate
        run: terraform validate
        working-directory: infra

      - name: Terraform Plan
        working-directory: infra
        run: |
          terraform plan -var="bucket_name=${{ env.S3_BUCKET_NAME }}" -var="aws_region=${{ env.AWS_REGION }}" | tee ${{ env.TF_PLAN_OUTPUT_FILE }}

      - name: Print Terraform Plan to GitHub Actions Summary
        uses: sgametrio/terraform-summary-action@main
        with:
          log-file: "./infra/${{ env.TF_PLAN_OUTPUT_FILE }}"
          title: "Terraform Plan Summary"

  tf_deploy:
    name: Terraform Deploy
    runs-on: ubuntu-latest
    needs: tf_plan
    if: ${{ github.ref_name == 'update/s3-bucket-task' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: infra
        run: terraform init

      - name: Terraform Apply
        working-directory: infra
        run: terraform apply -auto-approve -var="bucket_name=${{ env.S3_BUCKET_NAME }}" -var="aws_region=${{ env.AWS_REGION }}"

      - name: List S3 Buckets
        run: aws s3 ls --region ${{ env.AWS_REGION }}

      - name: Terraform Destroy
        working-directory: infra
        run: terraform destroy -auto-approve -var="bucket_name=${{ env.S3_BUCKET_NAME }}" -var="aws_region=${{ env.AWS_REGION }}"
