name: Session 3 Homework Workflow

on:
  push:
    branches: ["feature/session3-homework"]
  workflow_dispatch:

env:
  PROJECT_NAME: "Session3 Homework"

jobs:
  info-collection:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT_TYPE: "Development"
    steps:
      - uses: actions/checkout@v4

      - name: Show All Environment Variables
        run: |
          echo "The project name is: $PROJECT_NAME"
          echo "The environment type is: $ENVIRONMENT_TYPE"
          echo "GitHub Actor: ${{ github.actor }}"
          echo "GitHub Workflow: ${{ github.workflow }}"

      - name: Generate Custom Output
        id: custom-output
        run: |
          echo "CUSTOM_MESSAGE=Workflow for $PROJECT_NAME, running on branch ${{ github.ref_name }}." >> $GITHUB_OUTPUT

      - name: Message from Previous Step
        run: echo "Message from previous step: ${{ steps.custom-output.outputs.CUSTOM_MESSAGE }}"

  aws-cli:
    runs-on: ubuntu-latest
    needs: info-collection
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: List S3 Buckets
        run: aws s3 ls --region us-east-1
