name: Session 2 Homework Pipeline

on:
  push:
    branches: [production]
    paths: ['app/**']
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        type: choice
        options: [dev, staging, production]
        default: dev
      reason:
        description: 'Reason for deployment'
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          chmod +x app/deployment_script.sh
          ./app/deployment_script.sh "${{ github.event.inputs.environment }}" "${{ github.event.inputs.reason }}"
