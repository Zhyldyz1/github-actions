name: Python App Build & Test
on:
  push:
    branches: 
      - app/simple-app
      - main
    paths:
      - 'app/**'
      - '.github/workflows/session4-classwork-python-app.yml'
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@V4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: 3.9

      - name: Install Python Dependencies
        id: install-dependency
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Run Pytest
        if: success() 
        run: |
          cd app
          pytest
          echo "It was done successfully"
