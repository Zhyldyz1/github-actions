name: Session5 - Class Work
on:
  push:
    branches:
      - main
      - session5-classwork
    paths:
      - '.github/workflows/session5-classwork.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env: 
  PYTHON_VERSION: '3.9'

jobs:
  job-a:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{env.PYTHON_VERSION}}

      - name: Run Python Script
        working-directory: scripts
        run: |
          python simple_python.py

  job-b:
    runs-on: ubuntu-latest
    needs: job-a
    steps:
      - name: Show
        run: |
           echo "${{github.ref}}"