name: Infra S3 Bucket

on:
  push:
    branches:
      - main
      - infra/s3-bucket-task
    paths:
      - '.github/workflows/infra-s3-workflow.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: 'us-east-1'
  S3_BUCKET_NAME: 'github-actions-tf-task-zhyldyz'
  TF_VERSION: '1.11.4' 

permissions:
  id-token: write
  contents: read

jobs:
  tf_plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init
        working-directory: infra

      - name: Terraform Validate
        run: terraform validate
        working-directory: infra

      - name: Terraform Plan
        run: |
          terraform plan -out=plan.tfplan
          terraform show -json plan.tfplan > plan.json
        working-directory: infra

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: |
            infra/plan.tfplan
            infra/plan.json

  tf_deploy:
    name: Terraform Deploy
    runs-on: ubuntu-latest
    needs: tf_plan
    if: ${{ github.ref_name == 'infra/s3-bucket-task'}}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: infra
        run: terraform init

      - name: Terraform Apply
        working-directory: infra
        run: terraform apply -auto-approve -var="bucket_name=${{ env.S3_BUCKET_NAME }}" -var="aws_region=${{ env.AWS_REGION }}"

      - name: List S3 Buckets
        run: aws s3 ls --region ${{ env.AWS_REGION }}

      - name: Terraform Destroy
        working-directory: infra
        run: terraform destroy -auto-approve -var="bucket_name=${{ env.S3_BUCKET_NAME }}" -var="aws_region=${{ env.AWS_REGION }}"